services:
  robotont:
    build:
      context: .
    container_name: robotont
    environment:
      ROS_DOMAIN_ID: 42
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      LIBGL_ALWAYS_SOFTWARE: "1"
      ROBOTONT_WORLD_MODE: ${ROBOTONT_WORLD_MODE:-gazebo}
      ROBOTONT_WORLD_FILE: ${ROBOTONT_WORLD_FILE:-/ws/worlds/robotont_room.json}
      ROBOTONT_PRIMARY_COLOR: ${ROBOTONT_PRIMARY_COLOR:-0.16 0.65 0.98 1.0}
      ROBOTONT_FOXGLOVE_PORT: ${ROBOTONT_FOXGLOVE_PORT:-8765}
      ROBOTONT_EXTRA_LAUNCH_ARGS: ${ROBOTONT_EXTRA_LAUNCH_ARGS:-}
      GZ_PARTITION: ${GZ_PARTITION:-robotont}
      GZ_DISCOVERY_MSG_PORT: ${GZ_DISCOVERY_MSG_PORT:-10317}
      GZ_DISCOVERY_SRV_PORT: ${GZ_DISCOVERY_SRV_PORT:-10318}
      IGN_PARTITION: ${GZ_PARTITION:-robotont}
      IGN_DISCOVERY_MSG_PORT: ${GZ_DISCOVERY_MSG_PORT:-10317}
      IGN_DISCOVERY_SRV_PORT: ${GZ_DISCOVERY_SRV_PORT:-10318}
    ports:
      - "${ROBOTONT_FOXGLOVE_HOST_PORT:-8765}:${ROBOTONT_FOXGLOVE_PORT:-8765}"
      - "${GZ_DISCOVERY_MSG_HOST_PORT:-10317}:${GZ_DISCOVERY_MSG_PORT:-10317}/udp"
      - "${GZ_DISCOVERY_SRV_HOST_PORT:-10318}:${GZ_DISCOVERY_SRV_PORT:-10318}/udp"
    volumes:
      - ./worlds:/ws/worlds:ro
      - ./docker_tmp:/tmp:rw
    stdin_open: true
    tty: true
